<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Saudi360 — MVP Flow Builder</title>
<style>
  :root{
    --bg:#0e1116;
    --panel:#161b22;
    --panel-2:#1c232d;
    --ink:#e8edf2;
    --ink-dim:#9aa6b2;
    --line:#2a323d;
    --accent:#3ddc97;
    --accent-2:#7c8cff;

    --member:#16a34a;   --member-bg:#0f1d16;
    --organiser:#8b5cf6; --organiser-bg:#1a1426;
    --vendor:#06b6d4;   --vendor-bg:#0c1c20;
    --admin:#64748b;    --admin-bg:#161b22;
    --system:#3b82f6;   --system-bg:#0e1726;
    --decision:#f59e0b; --decision-bg:#241a08;
    --byes:#22c55e;     --byes-bg:#0f1d14;
    --bno:#ef4444;      --bno-bg:#241011;
    --terminal:#cbd5e1; --terminal-bg:#1e2530;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  header,.help{flex:0 0 auto}
  /* ---------- top bar ---------- */
  header{
    display:flex;align-items:center;gap:16px;
    padding:12px 18px;
    background:linear-gradient(180deg,#11161d,#0e1116);
    border-bottom:1px solid var(--line);
    position:relative;z-index:30;
  }
  .brand{display:flex;flex-direction:column;line-height:1.1}
  .brand b{font-size:16px;letter-spacing:.3px}
  .brand b span{color:var(--accent)}
  .brand small{color:var(--ink-dim);font-size:11px;margin-top:2px}
  .tabs{display:flex;gap:6px;margin-left:8px}
  .tab{
    appearance:none;border:1px solid var(--line);background:var(--panel);
    color:var(--ink-dim);padding:8px 14px;border-radius:9px;cursor:pointer;
    font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;transition:.15s;
  }
  .tab .dot{width:9px;height:9px;border-radius:50%}
  .tab:hover{color:var(--ink);border-color:#3a4452}
  .tab.active{background:var(--panel-2);color:var(--ink);border-color:#46566a;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
  .spacer{flex:1}
  .toolbtn{
    appearance:none;border:1px solid var(--line);background:var(--panel);
    color:var(--ink-dim);padding:8px 11px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;transition:.15s;
  }
  .toolbtn:hover{color:var(--ink);border-color:#3a4452;background:var(--panel-2)}
  .toolbtn.danger:hover{color:#fff;border-color:var(--bno);background:#2a1416}

  /* ---------- help strip ---------- */
  .help{
    display:flex;flex-wrap:wrap;align-items:center;gap:18px;
    padding:7px 18px;background:#11161d;border-bottom:1px solid var(--line);
    color:var(--ink-dim);font-size:11.5px;z-index:20;position:relative;
  }
  .help b{color:var(--ink);font-weight:600}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-left:auto}
  .lg{display:flex;align-items:center;gap:6px}
  .lg i{width:14px;height:14px;border-radius:4px;display:inline-block;border-left:4px solid}

  /* ---------- canvas ---------- */
  .stage{flex:1 1 auto;position:relative;min-height:0}
  .wrap{position:absolute;inset:0;overflow:auto;}
  #scroll{position:relative;}
  #canvas{position:relative;width:1180px;}
  svg.edges{position:absolute;left:0;top:0;overflow:visible;z-index:1}
  svg.edges path.hit{stroke:transparent;stroke-width:18px;fill:none;cursor:pointer}
  svg.edges path.vis{stroke:#5b6675;stroke-width:2px;fill:none}
  svg.edges g.edge:hover path.vis{stroke:var(--accent-2)}
  svg.edges g.edge.sel path.vis{stroke:var(--bno);stroke-width:2.6px}
  svg.edges path.temp{stroke:var(--accent);stroke-width:2px;stroke-dasharray:5 5;fill:none}

  .section-label{
    position:absolute;color:var(--ink-dim);font-size:11px;font-weight:700;letter-spacing:1.4px;
    text-transform:uppercase;z-index:1;user-select:none;
    border-left:2px solid var(--accent);padding-left:8px;
  }

  .node{
    position:absolute;width:300px;background:var(--panel);border:1px solid var(--line);
    border-left:5px solid #555;border-radius:11px;padding:12px 14px;z-index:2;
    box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:grab;user-select:none;
    transition:box-shadow .12s,border-color .12s;
  }
  .node:hover{box-shadow:0 6px 20px rgba(0,0,0,.5)}
  .node.sel{outline:2px solid var(--accent);outline-offset:1px}
  .node.dragging{cursor:grabbing;z-index:10;box-shadow:0 14px 34px rgba(0,0,0,.6)}
  .node .kind{font-size:9.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;opacity:.85;margin-bottom:5px}
  .node .txt{font-size:12.5px;line-height:1.42;color:var(--ink)}
  .node.member{border-left-color:var(--member);background:var(--member-bg)}
  .node.member .kind{color:var(--member)}
  .node.organiser{border-left-color:var(--organiser);background:var(--organiser-bg)}
  .node.organiser .kind{color:var(--organiser)}
  .node.vendor{border-left-color:var(--vendor);background:var(--vendor-bg)}
  .node.vendor .kind{color:var(--vendor)}
  .node.admin{border-left-color:var(--admin);background:var(--admin-bg)}
  .node.admin .kind{color:#94a3b8}
  .node.system{border-left-color:var(--system);border-left-style:dashed;background:var(--system-bg)}
  .node.system .kind{color:var(--system)}
  .node.decision{border-left-color:var(--decision);background:var(--decision-bg)}
  .node.decision .kind{color:var(--decision)}
  .node.byes{border-left-color:var(--byes);background:var(--byes-bg)}
  .node.byes .kind{color:var(--byes)}
  .node.bno{border-left-color:var(--bno);background:var(--bno-bg)}
  .node.bno .kind{color:var(--bno)}
  .node.terminal{border-left-color:var(--terminal);background:var(--terminal-bg)}
  .node.terminal .kind{color:var(--terminal)}
  .node.terminal .txt{font-weight:700}

  .node .actions{position:absolute;top:6px;right:7px;display:flex;gap:4px;opacity:0;transition:.12s}
  .node:hover .actions{opacity:1}
  .node .ic{
    width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:rgba(0,0,0,.35);
    color:var(--ink-dim);font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .node .ic:hover{color:#fff;background:#000}
  .node .ic.del:hover{color:#fff;background:var(--bno);border-color:var(--bno)}
  .node .ic.has{color:var(--accent);border-color:var(--accent);opacity:1}
  .node:not(:hover) .ic.has{opacity:1}

  .handle{
    position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
    width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);
    cursor:crosshair;opacity:.35;transition:.12s;z-index:3;
  }
  .node:hover .handle{opacity:1;transform:translateX(-50%) scale(1.15)}
  .cmt-flag{
    position:absolute;bottom:8px;left:14px;right:36px;font-size:10.5px;color:var(--accent-2);
    font-style:italic;line-height:1.3;display:none;
  }
  .node.has-cmt{padding-bottom:30px}
  .node.has-cmt .cmt-flag{display:block;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------- modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100}
  .overlay.show{display:flex}
  .modal{width:min(460px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .modal h3{margin:0 0 4px;font-size:15px}
  .modal .sub{color:var(--ink-dim);font-size:12px;margin:0 0 12px;line-height:1.4}
  .modal textarea{width:100%;min-height:120px;background:var(--bg);border:1px solid var(--line);border-radius:9px;
    color:var(--ink);padding:10px;font-family:inherit;font-size:13px;resize:vertical}
  .modal textarea:focus{outline:none;border-color:var(--accent-2)}
  .modal select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;color:var(--ink);
    padding:9px 10px;font-family:inherit;font-size:13px;margin-bottom:10px}
  .modal select:focus{outline:none;border-color:var(--accent-2)}
  .modal .row{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0a0d11;border:1px solid var(--line);
    color:var(--ink);padding:10px 16px;border-radius:10px;z-index:200;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  .empty-note{position:absolute;left:50%;top:120px;transform:translateX(-50%);color:var(--ink-dim);font-size:13px;text-align:center;max-width:480px;line-height:1.5;z-index:2}
  input[type=file]{display:none}
</style>
</head>
<body>

<header>
  <div class="brand">
    <b>Saudi<span>360</span> · Flow Builder</b>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="spacer"></div>
  <button class="toolbtn" id="addBoxBtn" title="Create a new box" style="border-color:var(--accent);color:var(--accent)">＋ Add box</button>
  <button class="toolbtn" id="undoBtn" title="Undo the last change (Ctrl/Cmd+Z)">↩ Undo</button>
  <button class="toolbtn" id="exportBtn" title="Download an HTML file you can send — it opens to these exact flows">⬇ Export &amp; share</button>
</header>

<div class="stage">
  <div class="wrap" id="wrap">
    <div id="scroll">
      <div id="canvas">
        <svg class="edges" id="svg"></svg>
      </div>
    </div>
  </div>
</div>

<!-- comment modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3>Comment</h3>
    <p class="sub" id="cmtCtx"></p>
    <textarea id="cmtText" placeholder="Add a note for your co-founders about this step…"></textarea>
    <div class="row">
      <button class="toolbtn danger" id="cmtClear">Clear</button>
      <button class="toolbtn" id="cmtCancel">Cancel</button>
      <button class="toolbtn" id="cmtSave" style="border-color:var(--accent);color:var(--accent)">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- add / edit box modal -->
<div class="overlay" id="boxOverlay">
  <div class="modal">
    <h3 id="boxTitle">Add a box</h3>
    <p class="sub">Choose what kind of step this is, then type its text. You can move, connect, comment and delete it like any other box, and drag its green dot to draw an arrow.</p>
    <select id="boxType">
      <option value="member">Member action</option>
      <option value="organiser">Organiser action</option>
      <option value="vendor">Vendor action</option>
      <option value="admin">Admin action</option>
      <option value="system">System / automatic</option>
      <option value="decision">Decision point</option>
      <option value="byes">Branch — yes / positive</option>
      <option value="bno">Branch — no / alternative</option>
      <option value="terminal">End state</option>
    </select>
    <textarea id="boxText" placeholder="Type the step text…"></textarea>
    <div class="row">
      <button class="toolbtn" id="boxCancel">Cancel</button>
      <button class="toolbtn" id="boxSave" style="border-color:var(--accent);color:var(--accent)">Add box</button>
    </div>
  </div>
</div>

/* ---------- build a fresh default state from RAW ---------- */
function buildDefaults(){
  const out = {};
  for(const key in RAW){
    const b = RAW[key];
    out[key] = {
      nodes: b.nodes.map(([id,type,text,c,r])=>({
        id, type, text, x: COLX[c], y: TOP + r*ROW_H, comment:""
      })),
      edges: b.edges.map(([from,to])=>({id:from+"_"+to, from, to}))
    };
  }
  return out;
}

/* ---------- state ---------- */
let state = loadState();
let current = "user";
let selNode = null, selEdge = null;
let history = [];

function loadState(){
  if(window.__SNAPSHOT__ && window.__SNAPSHOT__.user) return window.__SNAPSHOT__;
  const raw = store.get(STORE_KEY);
  if(raw){ try{ const p = JSON.parse(raw); if(p && p.user) return p; }catch(e){} }
  return buildDefaults();
}
function save(){ store.set(STORE_KEY, JSON.stringify(state)); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function pushHistory(snap){ history.push(snap||clone(state)); if(history.length>60) history.shift(); updateUndoBtn(); }
function undo(){
  if(!history.length){ toast("Nothing to undo"); return; }
  state = history.pop(); selNode=selEdge=null; save(); renderBoard(); updateUndoBtn(); toast("Undone");
}
function updateUndoBtn(){
  const b=document.getElementById("undoBtn"); if(!b) return;
  b.disabled = history.length===0; b.style.opacity = history.length? "1":".45";
}

/* ---------- DOM refs ---------- */
const tabsEl = document.getElementById("tabs");
const legendEl = document.getElementById("legend");
const canvas = document.getElementById("canvas");
const svg = document.getElementById("svg");
const wrap = document.getElementById("wrap");
const scroll = document.getElementById("scroll");
const elById = {};

/* ---------- arrowhead def ---------- */
svg.innerHTML = `<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,3 L0,6 Z" fill="#5b6675"></path>
  </marker>
  <marker id="arrowHi" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,3 L0,6 Z" fill="var(--accent-2)"></path>
  </marker>
</defs>`;

/* ---------- tabs + legend ---------- */
function renderTabs(){
  tabsEl.innerHTML = "";
  for(const key in RAW){
    const b = RAW[key];
    const t = document.createElement("button");
    t.className = "tab" + (key===current?" active":"");
    t.innerHTML = `<span class="dot" style="background:${b.color}"></span>${b.name}`;
    t.onclick = ()=>{ current=key; selNode=selEdge=null; renderTabs(); renderBoard(); };
    tabsEl.appendChild(t);
  }
}
function renderLegend(){
  if(!legendEl) return;
  const items = [
    ["Member","--member"],["Organiser","--organiser"],["Vendor","--vendor"],
    ["Admin","--admin"],["System","--system"],["Decision","--decision"],["End","--terminal"]
  ];
  legendEl.innerHTML = items.map(([l,c])=>`<span class="lg"><i style="border-left-color:var(${c});background:var(${c.replace('--','--')}-bg,transparent)"></i>${l}</span>`).join("");
}

/* ---------- render board ---------- */
function renderBoard(){
  // clear nodes & labels (keep svg)
  [...canvas.querySelectorAll(".node,.section-label,.empty-note")].forEach(n=>n.remove());
  for(const k in elById) delete elById[k];

  const b = state[current];

  // section labels
  (RAW[current].sections||[]).forEach(s=>{
    const lab = document.createElement("div");
    lab.className = "section-label";
    lab.style.left = "20px";
    lab.style.top = (TOP + s.r*ROW_H - 26) + "px";
    lab.textContent = s.t;
    canvas.appendChild(lab);
  });

  // nodes
  let maxY = 0;
  b.nodes.forEach(n=>{
    const el = document.createElement("div");
    el.className = "node " + n.type + (n.comment?" has-cmt":"");
    el.style.left = n.x + "px";
    el.style.top = n.y + "px";
    el.dataset.id = n.id;
    el.innerHTML = `
      <div class="kind">${KIND_LABEL[n.type]||n.type}</div>
      <div class="txt">${escapeHtml(n.text)}</div>
      <div class="cmt-flag">💬 ${escapeHtml(n.comment||"")}</div>
      <div class="actions">
        ${n.custom?'<div class="ic edit" title="Edit text">✎</div>':''}
        <div class="ic cmt ${n.comment?'has':''}" title="Comment">💬</div>
        <div class="ic del" title="Remove step">✕</div>
      </div>
      <div class="handle" title="Drag to connect"></div>`;
    canvas.appendChild(el);
    elById[n.id] = el;
    maxY = Math.max(maxY, n.y);
    wireNode(el, n);
  });

  if(b.nodes.length===0){
    const note = document.createElement("div");
    note.className = "empty-note";
    note.innerHTML = "This board is empty.<br>Use <b>Reset board</b> to restore the original recommended flow.";
    canvas.appendChild(note);
  }

  const h = Math.max(maxY + 260, wrap.clientHeight);
  canvas.style.height = h + "px";
  svg.setAttribute("width", 1180);
  svg.setAttribute("height", h);
  redrawEdges();
}

/* ---------- edges ---------- */
function rectOf(id){
  const el = elById[id]; if(!el) return null;
  return {x:el.offsetLeft, y:el.offsetTop, w:el.offsetWidth, h:el.offsetHeight};
}
function anchorPair(a,b){
  const ac={x:a.x+a.w/2,y:a.y+a.h/2}, bc={x:b.x+b.w/2,y:b.y+b.h/2};
  const dx=bc.x-ac.x, dy=bc.y-ac.y;
  let s,e;
  if(Math.abs(dy) >= Math.abs(dx)*0.6){ // mostly vertical
    if(dy>=0){ s={x:ac.x,y:a.y+a.h}; e={x:bc.x,y:b.y}; }
    else     { s={x:ac.x,y:a.y};     e={x:bc.x,y:b.y+b.h}; }
  } else {
    if(dx>=0){ s={x:a.x+a.w,y:ac.y}; e={x:b.x,y:bc.y}; }
    else     { s={x:a.x,y:ac.y};     e={x:b.x+b.w,y:bc.y}; }
  }
  return {s,e};
}
function pathD(s,e){
  const my=(s.y+e.y)/2;
  const dx=Math.abs(e.x-s.x), dy=Math.abs(e.y-s.y);
  if(dy>=dx) return `M${s.x},${s.y} C${s.x},${my} ${e.x},${my} ${e.x},${e.y}`;
  const mx=(s.x+e.x)/2;
  return `M${s.x},${s.y} C${mx},${s.y} ${mx},${e.y} ${e.x},${e.y}`;
}
function redrawEdges(){
  [...svg.querySelectorAll("g.edge,path.temp")].forEach(n=>n.remove());
  const b = state[current];
  b.edges.forEach(ed=>{
    const ra=rectOf(ed.from), rb=rectOf(ed.to);
    if(!ra||!rb) return;
    const {s,e}=anchorPair(ra,rb);
    const d=pathD(s,e);
    const g=document.createElementNS("http://www.w3.org/2000/svg","g");
    g.setAttribute("class","edge"+(selEdge===ed.id?" sel":""));
    g.dataset.id=ed.id;
    const hit=document.createElementNS("http://www.w3.org/2000/svg","path");
    hit.setAttribute("class","hit"); hit.setAttribute("d",d);
    const vis=document.createElementNS("http://www.w3.org/2000/svg","path");
    vis.setAttribute("class","vis"); vis.setAttribute("d",d);
    vis.setAttribute("marker-end", selEdge===ed.id?"url(#arrowHi)":"url(#arrow)");
    g.appendChild(hit); g.appendChild(vis);
    g.addEventListener("click",(ev)=>{ ev.stopPropagation(); selectEdge(ed.id); });
    svg.appendChild(g);
  });
}

/* ---------- selection ---------- */
function clearSel(){
  selNode=selEdge=null;
  [...canvas.querySelectorAll(".node.sel")].forEach(n=>n.classList.remove("sel"));
  redrawEdges();
}
function selectNode(id){
  clearSel(); selNode=id;
  if(elById[id]) elById[id].classList.add("sel");
}
function selectEdge(id){
  clearSel(); selEdge=id; redrawEdges();
}

/* ---------- node interactions ---------- */
function wireNode(el, n){
  const handle = el.querySelector(".handle");
  const delBtn = el.querySelector(".ic.del");
  const cmtBtn = el.querySelector(".ic.cmt");
  const editBtn = el.querySelector(".ic.edit");

  delBtn.addEventListener("click",(e)=>{ e.stopPropagation(); removeNode(n.id); });
  cmtBtn.addEventListener("click",(e)=>{ e.stopPropagation(); openComment(n.id); });
  if(editBtn) editBtn.addEventListener("click",(e)=>{ e.stopPropagation(); openEditBox(n.id); });

  // connect via handle
  handle.addEventListener("pointerdown",(e)=>{
    e.preventDefault(); e.stopPropagation();
    startConnect(n.id, e);
  });

  // drag body / click select
  el.addEventListener("pointerdown",(e)=>{
    if(e.target.closest(".ic")||e.target.closest(".handle")) return;
    startDrag(n, el, e);
  });
}

function startDrag(n, el, e){
  e.preventDefault();
  const startX = e.clientX, startY = e.clientY;
  const origX = n.x, origY = n.y;
  const snap = clone(state);
  let moved = false;
  el.classList.add("dragging");

  function move(ev){
    const dx = ev.clientX - startX, dy = ev.clientY - startY;
    if(Math.abs(dx)>4||Math.abs(dy)>4) moved = true;
    n.x = Math.max(0, origX + dx);
    n.y = Math.max(0, origY + dy);
    el.style.left = n.x+"px"; el.style.top = n.y+"px";
    redrawEdges();
  }
  function up(){
    document.removeEventListener("pointermove",move);
    document.removeEventListener("pointerup",up);
    el.classList.remove("dragging");
    if(moved){ pushHistory(snap); save(); growCanvas(); }
    else { selectNode(n.id); }
  }
  document.addEventListener("pointermove",move);
  document.addEventListener("pointerup",up);
}

function startConnect(fromId, e){
  const fromEl = elById[fromId];
  const sx = fromEl.offsetLeft + fromEl.offsetWidth/2;
  const sy = fromEl.offsetTop + fromEl.offsetHeight;
  const temp = document.createElementNS("http://www.w3.org/2000/svg","path");
  temp.setAttribute("class","temp");
  temp.setAttribute("marker-end","url(#arrowHi)");
  svg.appendChild(temp);

  function move(ev){
    const p = toCanvas(ev.clientX, ev.clientY);
    temp.setAttribute("d", pathD({x:sx,y:sy},{x:p.x,y:p.y}));
  }
  function up(ev){
    document.removeEventListener("pointermove",move);
    document.removeEventListener("pointerup",up);
    temp.remove();
    const target = document.elementFromPoint(ev.clientX, ev.clientY);
    const tEl = target && target.closest(".node");
    if(tEl){
      const toId = tEl.dataset.id;
      if(toId && toId!==fromId) addEdge(fromId, toId);
    }
  }
  document.addEventListener("pointermove",move);
  document.addEventListener("pointerup",up);
}

function toCanvas(clientX, clientY){
  const r = canvas.getBoundingClientRect();
  return {x: clientX - r.left, y: clientY - r.top};
}

/* ---------- mutations ---------- */
function addEdge(from,to){
  const b = state[current];
  const id = from+"_"+to;
  if(b.edges.some(e=>e.from===from&&e.to===to)){ toast("Those boxes are already connected"); return; }
  pushHistory();
  b.edges.push({id, from, to});
  save(); redrawEdges(); toast("Arrow added");
}
function removeNode(id){
  const b = state[current];
  pushHistory();
  b.nodes = b.nodes.filter(n=>n.id!==id);
  b.edges = b.edges.filter(e=>e.from!==id && e.to!==id);
  if(selNode===id) selNode=null;
  save(); renderBoard(); toast("Step removed");
}
function removeEdge(id){
  const b = state[current];
  pushHistory();
  b.edges = b.edges.filter(e=>e.id!==id);
  selEdge=null; save(); redrawEdges(); toast("Arrow deleted");
}
function growCanvas(){
  const b = state[current];
  let maxY=0; b.nodes.forEach(n=>maxY=Math.max(maxY,n.y));
  const h = Math.max(maxY+260, wrap.clientHeight);
  canvas.style.height = h+"px"; svg.setAttribute("height",h);
}

/* ---------- comment modal ---------- */
const overlay=document.getElementById("overlay");
const cmtText=document.getElementById("cmtText");
const cmtCtx=document.getElementById("cmtCtx");
let cmtTarget=null;
function openComment(id){
  const n = state[current].nodes.find(x=>x.id===id); if(!n) return;
  cmtTarget=id; cmtCtx.textContent = n.text;
  cmtText.value = n.comment||"";
  overlay.classList.add("show"); cmtText.focus();
}
function closeComment(){ overlay.classList.remove("show"); cmtTarget=null; }
document.getElementById("cmtCancel").onclick=closeComment;
document.getElementById("cmtSave").onclick=()=>{
  if(!cmtTarget) return;
  pushHistory();
  const n=state[current].nodes.find(x=>x.id===cmtTarget);
  n.comment = cmtText.value.trim();
  save(); renderBoard(); closeComment(); toast("Comment saved");
};
document.getElementById("cmtClear").onclick=()=>{
  if(!cmtTarget) return;
  pushHistory();
  const n=state[current].nodes.find(x=>x.id===cmtTarget);
  n.comment=""; cmtText.value=""; save(); renderBoard(); closeComment(); toast("Comment cleared");
};
overlay.addEventListener("click",e=>{ if(e.target===overlay) closeComment(); });

/* ---------- add / edit box modal ---------- */
const boxOverlay=document.getElementById("boxOverlay");
const boxType=document.getElementById("boxType");
const boxText=document.getElementById("boxText");
const boxTitle=document.getElementById("boxTitle");
const boxSaveBtn=document.getElementById("boxSave");
let editId=null;
const DEFAULT_TYPE={user:"member",organiser:"organiser",vendor:"vendor",admin:"admin"};

function openAddBox(){
  editId=null;
  boxTitle.textContent="Add a box";
  boxSaveBtn.textContent="Add box";
  boxType.value=DEFAULT_TYPE[current]||"member";
  boxText.value="";
  boxOverlay.classList.add("show"); boxText.focus();
}
function openEditBox(id){
  const n=state[current].nodes.find(x=>x.id===id); if(!n) return;
  editId=id;
  boxTitle.textContent="Edit box";
  boxSaveBtn.textContent="Save changes";
  boxType.value=n.type; boxText.value=n.text;
  boxOverlay.classList.add("show"); boxText.focus();
}
function closeBox(){ boxOverlay.classList.remove("show"); editId=null; }
boxSaveBtn.onclick=()=>{
  const txt=boxText.value.trim();
  if(!txt){ toast("Type some text first"); return; }
  const isEdit=!!editId;
  pushHistory();
  if(isEdit){
    const n=state[current].nodes.find(x=>x.id===editId);
    n.type=boxType.value; n.text=txt;
  } else {
    const id="n"+Date.now().toString(36)+Math.floor(Math.random()*1000);
    const x=Math.max(0, Math.min(880, wrap.scrollLeft + wrap.clientWidth/2 - 150));
    const y=wrap.scrollTop + 100;
    state[current].nodes.push({id,type:boxType.value,text:txt,x,y,comment:"",custom:true});
  }
  save(); renderBoard(); closeBox(); toast(isEdit?"Box updated":"Box added");
};
document.getElementById("boxCancel").onclick=closeBox;
document.getElementById("addBoxBtn").onclick=openAddBox;
boxOverlay.addEventListener("click",e=>{ if(e.target===boxOverlay) closeBox(); });

/* ---------- toolbar ---------- */
document.getElementById("undoBtn").onclick=undo;
document.getElementById("exportBtn").onclick=()=>{
  const snap = JSON.stringify(state).replace(/</g,"\\u003c");
  const M0 = "<!--S360_"+"START-->", M1 = "<!--S360_"+"END-->";
  const open = "<scr"+"ipt>", close = "<\/scr"+"ipt>";
  let doc = PRISTINE_HTML;
  const i = doc.indexOf(M0);
  if(i>=0){ const j = doc.indexOf(M1); if(j>=0) doc = doc.slice(0,i) + doc.slice(j+M1.length); }
  const inject = M0 + open + "window.__SNAPSHOT__=" + snap + ";" + close + M1;
  doc = doc.replace("</head>", inject + "\n</head>");
  const blob = new Blob([doc], {type:"text/html"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "saudi360-flows.html"; a.click();
  URL.revokeObjectURL(a.href); toast("Saved as HTML — ready to send");
};

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  if(overlay.classList.contains("show")||boxOverlay.classList.contains("show")) return;
  if((e.ctrlKey||e.metaKey) && (e.key==="z"||e.key==="Z")){ e.preventDefault(); undo(); return; }
  if(e.key==="Delete"||e.key==="Backspace"){
    if(selEdge){ e.preventDefault(); removeEdge(selEdge); }
    else if(selNode){ e.preventDefault(); removeNode(selNode); }
  } else if(e.key==="Escape"){ clearSel(); }
});
wrap.addEventListener("pointerdown",e=>{ if(e.target===wrap||e.target===scroll||e.target===canvas||e.target===svg) clearSel(); });

/* ---------- helpers ---------- */
function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function confirmSafe(msg){ try{ return window.confirm(msg); }catch(e){ return true; } }
let toastT;
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1600);
}

/* ---------- boot ---------- */
renderTabs(); renderBoard(); updateUndoBtn();
window.addEventListener("resize",growCanvas);
</script>
